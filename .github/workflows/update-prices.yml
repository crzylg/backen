name: Update Germany Ingredient Prices

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches: [ "claude/pastaci-fiyat-hesaplayici-dwpa3v" ]
    paths:
      - 'js/ingredients.js'
      - 'scripts/fetch-prices.mjs'

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Germany prices from Open Food Facts
        run: node scripts/fetch-prices.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git diff --staged --quiet || git commit -m "Update Germany ingredient prices"
          git push
