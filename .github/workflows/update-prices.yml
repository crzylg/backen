name: Update Germany Ingredient Prices

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches: [ "claude/pastaci-fiyat-hesaplayici-dwpa3v" ]
    paths:
      - 'js/ingredients.js'
      - 'scripts/fetch-prices.mjs'

permissions:
  contents: write
  actions: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Germany prices from Open Food Facts
        run: node scripts/fetch-prices.mjs

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update Germany ingredient prices"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Commits pushed with the default GITHUB_TOKEN do not trigger other
      # workflows' push events (GitHub's loop-prevention), so deploy-pages.yml
      # would otherwise never pick up a fresh data/prices.json. Trigger it
      # explicitly instead.
      - name: Trigger Pages redeploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref ${{ github.ref_name }}
